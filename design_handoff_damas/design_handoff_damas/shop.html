<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damas — Shop</title>
<link rel="stylesheet" href="assets/ds.css" />
<link rel="stylesheet" href="assets/board.css" />
<style>
  .shop-head { margin-bottom: 30px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .shop-head h1 { font-size: 40px; }
  .shop-head p { color: var(--muted); margin-top: 6px; font-size: 16px; max-width: 46ch; }
  .owned-pill { color: var(--green); }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .skin-card { padding: 16px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .skin-preview { position: relative; border-radius: 14px; padding: 18px; margin: -16px -16px 16px; background: radial-gradient(120% 120% at 50% 0%, rgba(255,255,255,.04), transparent); display: grid; place-items: center; }
  .skin-preview .board { max-width: 190px; transition: transform .3s var(--ease); }
  .skin-card:hover .skin-preview .board { transform: scale(1.05) rotate(-1deg); }
  .skin-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .skin-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .skin-tag { font-size: 11.5px; color: var(--muted-2); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-top: 2px; }
  .skin-blurb { color: var(--muted); font-size: 13.5px; line-height: 1.45; margin: 10px 0 16px; flex: 1; }
  .skin-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .skin-price { font-size: 19px; font-weight: 700; font-family: 'Playfair Display', serif; }
  .skin-price.free { color: var(--green); }
  .owned-banner { position: absolute; top: 14px; right: 14px; z-index: 3; }

  /* stripe checkout */
  .scrim { position: fixed; inset: 0; background: rgba(6,6,9,.74); backdrop-filter: blur(7px); display: none; place-items: center; z-index: 200; padding: 24px; }
  .scrim.open { display: grid; animation: fade .25s var(--ease); }
  .checkout { width: 100%; max-width: 420px; padding: 0; overflow: hidden; }
  .co-head { padding: 22px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
  .co-head .board { width: 56px; flex-shrink: 0; }
  .co-head .ci-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; }
  .co-head .ci-sub { color: var(--muted-2); font-size: 12.5px; }
  .co-head .ci-price { margin-left: auto; font-size: 20px; font-weight: 700; font-family: 'Playfair Display', serif; }
  .co-body { padding: 22px 24px; }
  .co-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 7px; display: block; }
  .co-card { display: flex; align-items: center; gap: 0; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-2); overflow: hidden; margin-bottom: 12px; }
  .co-card input { border: 0; background: transparent; color: var(--text); padding: 13px 14px; font: 15px Inter, sans-serif; outline: none; width: 100%; }
  .co-card .brandmk { width: 30px; height: 20px; border-radius: 4px; background: linear-gradient(135deg,#635BFF,#8B85FF); margin: 0 12px 0 4px; flex-shrink: 0; }
  .co-split { display: flex; gap: 12px; }
  .co-split .co-card { flex: 1; }
  .co-pay { margin-top: 18px; }
  .co-pay .btn { background: #635BFF; color: #fff; border: 0; box-shadow: 0 8px 22px -8px rgba(99,91,255,.6); }
  .co-pay .btn:hover { background: #7167ff; transform: translateY(-2px); }
  .co-pay .btn.processing { opacity: .8; }
  .co-fine { text-align: center; color: var(--muted-2); font-size: 11.5px; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .co-x { position: absolute; top: 14px; right: 16px; background: none; border: 0; color: var(--muted-2); font-size: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; z-index: 4; }
  .co-x:hover { background: var(--bg-2); color: var(--text); }

  /* success */
  .co-success { padding: 40px 28px; text-align: center; }
  .co-success .check { width: 60px; height: 60px; border-radius: 50%; background: var(--green-dim); color: var(--green); display: grid; place-items: center; font-size: 30px; margin: 0 auto 18px; box-shadow: 0 0 0 1px rgba(91,201,138,.3); }
  .co-success h3 { font-size: 24px; }
  .co-success p { color: var(--muted); margin: 8px 0 22px; }
</style>
</head>
<body>
  <div id="nav-slot"></div>
  <main class="page wrap">
    <div class="shop-head">
      <div>
        <span class="eyebrow">Cosmetics</span>
        <h1 class="serif" style="margin-top:8px;">Board skins</h1>
        <p>Dress the board your way. Skins are purely cosmetic — they never change the rules or the AI.</p>
      </div>
      <span class="pill owned-pill"><span id="owned-count">0</span> owned</span>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </main>

  <!-- stripe checkout -->
  <div class="scrim" id="checkout">
    <div class="checkout card" style="position:relative;">
      <button class="co-x" data-close aria-label="Close">✕</button>
      <div id="co-form">
        <div class="co-head">
          <div class="board" id="co-board"></div>
          <div>
            <div class="ci-name" id="co-name">Skin</div>
            <div class="ci-sub">Damas · cosmetic board skin</div>
          </div>
          <div class="ci-price" id="co-price">$0</div>
        </div>
        <div class="co-body">
          <label class="co-label">Card information</label>
          <div class="co-card">
            <input type="text" placeholder="1234 1234 1234 1234" value="4242 4242 4242 4242" />
            <span class="brandmk"></span>
          </div>
          <div class="co-split">
            <div class="co-card"><input type="text" placeholder="MM / YY" value="12 / 28" /></div>
            <div class="co-card"><input type="text" placeholder="CVC" value="123" /></div>
          </div>
          <div class="co-pay">
            <button class="btn btn-block btn-lg" id="pay-btn">Pay <span id="pay-amt"></span></button>
          </div>
          <div class="co-fine"><span>🔒</span> Secured by Stripe · test mode</div>
        </div>
      </div>
      <div id="co-done" class="co-success" style="display:none;">
        <div class="check">✓</div>
        <h3 class="serif">Purchase complete</h3>
        <p id="done-msg">The skin is now in your collection.</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <a class="btn btn-gold btn-block" href="me.html">Equip it in your profile</a>
          <button class="btn btn-ghost btn-block" data-close>Keep browsing</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/engine.js"></script>
  <script src="assets/shared.js"></script>
  <script>
    Store.mountNav('shop');

    function updateOwnedCount() {
      document.getElementById('owned-count').textContent = Store.owned().length;
    }

    function render() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      Store.SKINS.forEach(s => {
        const owned = Store.isOwned(s.id);
        const free = s.price === 0;
        const card = document.createElement('div');
        card.className = 'card card-hover skin-card';
        card.innerHTML = `
          ${owned ? '<span class="badge badge-owned owned-banner"><i class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--green);"></i>OWNED</span>' : ''}
          <div class="skin-preview"><div class="board"></div></div>
          <div class="skin-top">
            <div>
              <div class="skin-name">${s.name}</div>
              <div class="skin-tag">${s.tag}</div>
            </div>
          </div>
          <div class="skin-blurb">${s.blurb}</div>
          <div class="skin-foot">
            <span class="skin-price ${free ? 'free' : ''}">${Store.price(s.price)}</span>
            ${owned
              ? '<a class="btn btn-ghost btn-sm" href="me.html">Equip</a>'
              : free
                ? '<span class="badge badge-gold">Included</span>'
                : `<button class="btn btn-gold btn-sm" data-buy="${s.id}">Buy skin</button>`}
          </div>`;
        grid.appendChild(card);
        Store.renderStaticBoard(card.querySelector('.skin-preview .board'), { mini: true, skin: s.id });
        const buy = card.querySelector('[data-buy]');
        if (buy) buy.addEventListener('click', () => openCheckout(s));
      });
      updateOwnedCount();
    }

    // ---- checkout ----
    const scrim = document.getElementById('checkout');
    let current = null;
    function openCheckout(skin) {
      current = skin;
      document.getElementById('co-form').style.display = '';
      document.getElementById('co-done').style.display = 'none';
      document.getElementById('co-name').textContent = skin.name;
      document.getElementById('co-price').textContent = Store.price(skin.price);
      document.getElementById('pay-amt').textContent = Store.price(skin.price);
      Store.renderStaticBoard(document.getElementById('co-board'), { mini: true, skin: skin.id });
      const pb = document.getElementById('pay-btn');
      pb.classList.remove('processing'); pb.disabled = false;
      pb.innerHTML = 'Pay <span id="pay-amt">' + Store.price(skin.price) + '</span>';
      scrim.classList.add('open');
    }
    function closeCheckout() { scrim.classList.remove('open'); }
    document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeCheckout));
    scrim.addEventListener('click', e => { if (e.target === scrim) closeCheckout(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCheckout(); });

    document.getElementById('pay-btn').addEventListener('click', () => {
      const pb = document.getElementById('pay-btn');
      pb.classList.add('processing'); pb.disabled = true; pb.textContent = 'Processing…';
      setTimeout(() => {
        Store.buy(current.id);
        document.getElementById('co-form').style.display = 'none';
        document.getElementById('co-done').style.display = '';
        document.getElementById('done-msg').textContent = current.name + ' is now in your collection.';
        render();
      }, 1100);
    });

    render();
  </script>
</body>
</html>
