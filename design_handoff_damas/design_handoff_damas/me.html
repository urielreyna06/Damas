<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damas — Profile</title>
<link rel="stylesheet" href="assets/ds.css" />
<link rel="stylesheet" href="assets/board.css" />
<style>
  .prof-head { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .prof-av { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 26px; color: var(--gold); background: linear-gradient(135deg,#2b2b34,#16161d); border: 1px solid var(--line-2); box-shadow: 0 0 0 4px rgba(227,178,60,.1); flex-shrink: 0; }
  .prof-head h1 { font-size: 32px; }
  .prof-head .sub { color: var(--muted); font-size: 14.5px; margin-top: 4px; }
  .prof-head .spacer { flex: 1; }

  .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 44px; }
  .stat { padding: 20px; }
  .stat .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); font-weight: 600; }
  .stat .value { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 700; margin-top: 8px; line-height: 1; }
  .stat .value.gold { color: var(--gold); }
  .stat .delta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .winbar { height: 6px; border-radius: 999px; background: var(--bg-3); margin-top: 14px; overflow: hidden; }
  .winbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); border-radius: 999px; }

  .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .sec-title h2 { font-size: 24px; }

  .board-sec { display: grid; grid-template-columns: 360px 1fr; gap: 32px; align-items: start; }
  .active-board-card { padding: 22px; }
  .ab-board { max-width: 300px; margin: 0 auto 16px; }
  .ab-name { text-align: center; font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .ab-tag { text-align: center; color: var(--muted-2); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
  .ab-equipped { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px; color: var(--green); font-size: 13px; font-weight: 600; }

  .skins-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; }
  .skin-tile { padding: 12px; cursor: pointer; position: relative; transition: transform .18s var(--ease), border-color .18s, box-shadow .18s; }
  .skin-tile:hover { transform: translateY(-3px); }
  .skin-tile[data-active="true"] { border-color: var(--gold-line); box-shadow: var(--sh-glow); }
  .skin-tile .board { margin-bottom: 10px; }
  .skin-tile .st-name { font-size: 13.5px; font-weight: 600; }
  .skin-tile .st-check { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #1a1505; display: none; place-items: center; font-size: 12px; font-weight: 700; box-shadow: var(--sh-1); }
  .skin-tile[data-active="true"] .st-check { display: grid; }
  .locked-tile { border-style: dashed; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted-2); gap: 8px; min-height: 150px; cursor: pointer; }
  .locked-tile:hover { border-color: var(--gold-line); color: var(--gold); }

  @media (max-width: 860px) {
    .stats-grid { grid-template-columns: repeat(2,1fr); }
    .board-sec { grid-template-columns: 1fr; }
    .active-board-card { max-width: 360px; }
  }
</style>
</head>
<body>
  <div id="nav-slot"></div>
  <main class="page wrap">
    <div class="prof-head">
      <div class="prof-av" id="prof-av">AM</div>
      <div>
        <h1 class="serif" id="prof-name">Player</h1>
        <div class="sub">Member since 2024 · plays mostly Medium</div>
      </div>
      <div class="spacer"></div>
      <a class="btn btn-gold" href="play.html">New game</a>
    </div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="sec-title">
      <h2 class="serif">Your board</h2>
      <a class="btn btn-quiet" href="shop.html">Browse the shop →</a>
    </div>
    <div class="board-sec">
      <div class="card active-board-card">
        <div class="ab-board board" id="ab-board"></div>
        <div class="ab-name" id="ab-name">Emerald Classic</div>
        <div class="ab-tag" id="ab-tag">Default</div>
        <div class="ab-equipped"><span>✓</span> Equipped</div>
      </div>
      <div>
        <div class="muted" style="font-size:13.5px;margin-bottom:14px;">Tap a skin to equip it — it'll be used in every game.</div>
        <div class="skins-list" id="skins-list"></div>
      </div>
    </div>
  </main>

  <script src="assets/engine.js"></script>
  <script src="assets/shared.js"></script>
  <script>
    Store.mountNav();
    const me = Store.user();
    const initials = n => n.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('prof-name').textContent = me.name;
    document.getElementById('prof-av').textContent = initials(me.name);

    // ---- stats ----
    const s = Store.stats();
    const rate = s.played ? Math.round(s.wins / s.played * 100) : 0;
    const stats = [
      { label: 'Games played', value: s.played, delta: 'all difficulties' },
      { label: 'Wins', value: s.wins, gold: true, delta: s.losses + ' losses · ' + s.draws + ' draws' },
      { label: 'Win rate', value: rate + '%', bar: rate },
      { label: 'Best streak', value: 6, delta: 'wins in a row' },
    ];
    const sg = document.getElementById('stats-grid');
    stats.forEach(st => {
      const el = document.createElement('div');
      el.className = 'card stat';
      el.innerHTML = `
        <div class="label">${st.label}</div>
        <div class="value ${st.gold ? 'gold' : ''}">${st.value}</div>
        ${st.bar != null ? `<div class="winbar"><i style="width:${st.bar}%"></i></div>` : `<div class="delta">${st.delta}</div>`}`;
      sg.appendChild(el);
    });

    // ---- active board + skin selector ----
    function setActive(id) {
      Store.setActiveSkin(id);
      const skin = Store.skinById(id);
      Store.renderStaticBoard(document.getElementById('ab-board'), { skin: id });
      document.getElementById('ab-name').textContent = skin.name;
      document.getElementById('ab-tag').textContent = skin.tag;
      document.querySelectorAll('.skin-tile').forEach(t =>
        t.setAttribute('data-active', t.getAttribute('data-skin') === id ? 'true' : 'false'));
    }

    function renderSkins() {
      const list = document.getElementById('skins-list');
      list.innerHTML = '';
      const active = Store.activeSkin();
      Store.owned().map(id => Store.skinById(id)).forEach(skin => {
        const tile = document.createElement('div');
        tile.className = 'card skin-tile';
        tile.setAttribute('data-skin', skin.id);
        tile.setAttribute('data-active', skin.id === active ? 'true' : 'false');
        tile.innerHTML = `<div class="board mini"></div><div class="st-name">${skin.name}</div><span class="st-check">✓</span>`;
        list.appendChild(tile);
        Store.renderStaticBoard(tile.querySelector('.board.mini'), { mini: true, skin: skin.id });
        tile.addEventListener('click', () => setActive(skin.id));
      });
      // locked / shop tile
      const remaining = Store.SKINS.length - Store.owned().length;
      if (remaining > 0) {
        const lt = document.createElement('a');
        lt.className = 'card locked-tile';
        lt.href = 'shop.html';
        lt.innerHTML = `<div style="font-size:24px;">＋</div><div style="font-weight:600;font-size:13.5px;">${remaining} more skin${remaining > 1 ? 's' : ''}</div><div style="font-size:12px;">in the shop</div>`;
        list.appendChild(lt);
      }
    }

    renderSkins();
    setActive(Store.activeSkin());
  </script>
</body>
</html>
