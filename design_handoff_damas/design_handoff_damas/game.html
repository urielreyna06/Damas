<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damas — Game</title>
<link rel="stylesheet" href="assets/ds.css" />
<link rel="stylesheet" href="assets/board.css" />
<style>
  /* ---------------- page layout ---------------- */
  .game-wrap { padding-top: 24px; padding-bottom: 80px; }
  .game-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .back-link { color: var(--muted); font-weight: 500; font-size: 14px; transition: color .18s; }
  .back-link:hover { color: var(--gold); }
  .game-id { font-size: 12.5px; letter-spacing: .04em; }
  .game-layout { display: grid; grid-template-columns: minmax(0,1fr) 332px; gap: 32px; align-items: start; }
  .board-col { min-width: 0; }
  .board-shell { position: relative; max-width: 624px; margin: 0 auto; }

  /* toast */
  .board-toast {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    background: rgba(229,99,77,.95); color: #fff; font-weight: 600; font-size: 13.5px;
    padding: 8px 16px; border-radius: 999px; box-shadow: var(--sh-2); z-index: 5;
    animation: fade .25s var(--ease);
  }

  /* ---------------- side panel ---------------- */
  .panel { display: flex; flex-direction: column; gap: 16px; }
  .turn-card { padding: 18px; }
  .players { display: flex; align-items: center; gap: 12px; }
  .player { display: flex; align-items: center; gap: 9px; flex: 1; padding: 8px; border-radius: 12px; transition: background .2s, box-shadow .2s; }
  .player.on { background: var(--gold-soft); box-shadow: inset 0 0 0 1px var(--gold-line); }
  .player.ai { justify-content: flex-end; }
  .pavatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--gold); background: linear-gradient(135deg,#2b2b34,#16161d); border: 1px solid var(--line-2); flex-shrink: 0; }
  .botavatar { color: var(--gold); }
  .pname { font-weight: 600; font-size: 14px; }
  .vs { color: var(--muted-2); font-size: 12px; font-style: italic; font-family: 'Playfair Display', serif; }
  .turn-status { margin-top: 14px; text-align: center; font-size: 14.5px; font-weight: 600; min-height: 20px; }
  .ts-you { color: var(--gold); } .ts-ai, .ts-think { color: var(--muted); } .ts-done { color: var(--muted-2); }
  .bot.thinking { animation: botpulse 1.1s var(--ease) infinite; display: inline-grid; }
  @keyframes botpulse { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .dots { display: inline-flex; gap: 3px; margin-left: 6px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: dotp 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes dotp { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  .meta-card { padding: 18px; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .pieces-count { font-size: 16px; font-weight: 600; color: var(--text); }
  .hist-card { padding: 18px; }
  .hist-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); font-weight: 600; margin-bottom: 12px; }
  .hist-empty { font-size: 13.5px; }
  .hist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hist-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 7px 11px; border-radius: 9px; background: var(--bg-2); animation: fade .3s var(--ease); }
  .hist-item.mine { box-shadow: inset 3px 0 0 var(--gold); }
  .hist-item.theirs { box-shadow: inset 3px 0 0 var(--muted-2); }
  .hi-by { font-weight: 600; width: 48px; color: var(--muted); }
  .hi-move { flex: 1; color: var(--text); }
  .hi-cap { color: var(--red); font-weight: 700; font-size: 12.5px; }

  .abandon { margin-top: 4px; background: transparent; border: 1px solid var(--line); color: var(--muted-2); font: 500 13.5px Inter, sans-serif; padding: 11px; border-radius: 12px; cursor: pointer; transition: all .18s; }
  .abandon:hover { color: var(--red); border-color: rgba(229,99,77,.4); background: var(--red-dim); }

  .confirm-bar { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--bg-1); border: 1px solid var(--line-2); padding: 12px 16px 12px 20px; border-radius: 14px; box-shadow: var(--sh-3); font-size: 14px; z-index: 60; }

  /* ---------------- end modal ---------------- */
  .modal-scrim { position: fixed; inset: 0; background: rgba(6,6,9,.7); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 100; padding: 24px; }
  .modal { width: 100%; max-width: 400px; padding: 36px 32px; text-align: center; }
  .result-badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; margin: 0 auto 18px; }
  .result-badge.win { background: var(--gold-soft); color: var(--gold); box-shadow: 0 0 0 1px var(--gold-line); }
  .result-badge.loss { background: var(--red-dim); color: var(--red); box-shadow: 0 0 0 1px rgba(229,99,77,.4); }
  .result-badge.draw { background: var(--bg-3); color: var(--muted); }
  .result-title { font-size: 34px; }
  .result-sub { margin: 10px 0 26px; font-size: 15px; }
  .modal-actions { display: flex; flex-direction: column; gap: 10px; }

  @media (max-width: 920px) {
    .game-layout { grid-template-columns: 1fr; gap: 22px; }
    .board-shell { max-width: 520px; }
    .panel { max-width: 520px; margin: 0 auto; width: 100%; }
  }
</style>
</head>
<body>
  <div id="nav-slot"></div>
  <main class="page" style="padding-top:0;">
    <div id="root"></div>
  </main>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="assets/engine.js"></script>
  <script src="assets/shared.js"></script>
  <script type="text/babel" src="assets/tweaks-panel.jsx"></script>
  <script type="text/babel" src="assets/game.jsx"></script>
</body>
</html>
