<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Retro pixel art checkers piece — Red -->
  <!-- Outline ring (darkest) -->
  <rect x="20" y="0"  width="24" height="4" fill="#660000"/>
  <rect x="12" y="4"  width="40" height="4" fill="#660000"/>
  <rect x="8"  y="8"  width="8"  height="4" fill="#660000"/>
  <rect x="48" y="8"  width="8"  height="4" fill="#660000"/>
  <rect x="4"  y="12" width="8"  height="36" fill="#660000"/>
  <rect x="52" y="12" width="8"  height="36" fill="#660000"/>
  <rect x="8"  y="52" width="8"  height="4" fill="#660000"/>
  <rect x="48" y="52" width="8"  height="4" fill="#660000"/>
  <rect x="12" y="56" width="40" height="4" fill="#660000"/>
  <rect x="20" y="60" width="24" height="4" fill="#660000"/>
  <!-- Body fill (main red) -->
  <rect x="12" y="8"  width="40" height="4" fill="#CC2200"/>
  <rect x="8"  y="12" width="48" height="36" fill="#CC2200"/>
  <rect x="12" y="52" width="40" height="4" fill="#CC2200"/>
  <!-- Highlight (bright, top-left) -->
  <rect x="16" y="12" width="20" height="4" fill="#FF5533"/>
  <rect x="12" y="16" width="20" height="4" fill="#FF5533"/>
  <rect x="12" y="20" width="12" height="4" fill="#FF5533"/>
  <!-- Shadow (dark, bottom-right) -->
  <rect x="32" y="44" width="20" height="4" fill="#881100"/>
  <rect x="36" y="40" width="16" height="4" fill="#881100"/>
  <rect x="40" y="36" width="12" height="4" fill="#881100"/>
</svg>
