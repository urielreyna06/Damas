  <line x1="100" y1="0" x2="100" y2="60" stroke="#2A2A3E" stroke-width="0.5"/>
  <!-- Pixel red piece (simplified) -->
  <rect x="20" y="10" width="30" height="4" fill="#660000"/>
  <rect x="16" y="14" width="38" height="20" fill="#CC2200"/>
  <rect x="20" y="34" width="30" height="4" fill="#660000"/>
  <rect x="20" y="14" width="14" height="6" fill="#FF5533"/>
