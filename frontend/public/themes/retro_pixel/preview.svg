  <line x1="0" y1="50" x2="120" y2="50" stroke="#2A2A3E" stroke-width="0.5"/>
  <line x1="20" y1="0" x2="20" y2="60" stroke="#2A2A3E" stroke-width="0.5"/>
  <line x1="40" y1="0" x2="40" y2="60" stroke="#2A2A3E" stroke-width="0.5"/>
