  <rect x="72" y="18" width="30" height="4" fill="#000000"/>
  <rect x="68" y="22" width="38" height="20" fill="#1A1A1A"/>
  <rect x="72" y="42" width="30" height="4" fill="#000000"/>
  <rect x="72" y="22" width="14" height="6" fill="#555555"/>
  <text x="60" y="57" text-anchor="middle" font-size="6" fill="#FF5533" font-family="monospace">RETRO PIXEL</text>
