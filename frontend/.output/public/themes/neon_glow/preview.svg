<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <rect width="120" height="60" fill="#0A0014" rx="4"/>
  <!-- Neon grid -->
  <line x1="30" y1="5" x2="30" y2="55" stroke="#330066" stroke-width="0.5"/>
  <line x1="90" y1="5" x2="90" y2="55" stroke="#330066" stroke-width="0.5"/>
  <line x1="5" y1="30" x2="115" y2="30" stroke="#330066" stroke-width="0.5"/>
  <!-- Neon red piece with glow -->
  <circle cx="42" cy="22" r="12" fill="#66002E" opacity="0.4"/>
  <circle cx="42" cy="22" r="10" fill="#CC0066"/>
  <circle cx="42" cy="22" r="10" fill="none" stroke="#FF00AA" stroke-width="1.5"/>
  <!-- Neon cyan piece with glow -->
  <circle cx="78" cy="38" r="12" fill="#003A3A" opacity="0.4"/>
  <circle cx="78" cy="38" r="10" fill="#00CCCC"/>
  <circle cx="78" cy="38" r="10" fill="none" stroke="#00FFFF" stroke-width="1.5"/>
  <text x="60" y="57" text-anchor="middle" font-size="6" fill="#00FFFF" font-family="sans-serif">Neon Glow</text>
</svg>
